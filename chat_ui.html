<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #app { width: 420px; height: 650px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8f4fd; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1a73e8; flex-shrink: 0; }
  .info p { font-size: 14px; font-weight: 600; color: #111; }
  .info span { font-size: 12px; color: #888; }
  .online { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; margin-left: auto; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot  { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  .bubble { background: #f1f3f4; color: #111; border-bottom-left-radius: 4px; }
  .time { font-size: 11px; color: #aaa; padding: 0 4px; }
  .typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; background: #f1f3f4; border-radius: 14px; border-bottom-left-radius: 4px; align-self: flex-start; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #aaa; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }
  #suggestions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px; }
  .sug { font-size: 12px; padding: 5px 12px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; color: #555; background: #fff; }
  .sug:hover { background: #f5f5f5; }
  #tts-toggle { padding: 0 14px 6px; }
  #tts-toggle label { font-size: 12px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  #voice-status { font-size: 12px; text-align: center; padding: 2px 14px 4px; min-height: 18px; color: #aaa; }
  #voice-status.recording { color: #e53935; font-weight: 500; }
  #voice-status.processing { color: #f57c00; }
  #voice-status.speaking   { color: #1a73e8; }
  /* partial transcript preview */
  #partial-preview { font-size: 12px; color: #888; font-style: italic; text-align: center; padding: 0 14px 4px; min-height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* volume bar */
  #vad-bar-wrap { padding: 0 14px 6px; display: none; }
  #vad-bar-wrap.active { display: block; }
  #vad-bar-bg { height: 4px; background: #eee; border-radius: 4px; overflow: hidden; }
  #vad-bar { height: 4px; width: 0%; background: #e53935; border-radius: 4px; transition: width 0.05s; }
  #vad-bar.loud { background: #1D9E75; }
  #input-area { padding: 10px 14px 12px; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: flex-end; }
  #msg-input { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; resize: none; height: 38px; max-height: 100px; outline: none; line-height: 1.4; color: #111; }
  #msg-input:focus { border-color: #1a73e8; }
  #send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: #1a73e8; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
  #send-btn:hover { background: #1558b0; }
  #send-btn:disabled, #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mic-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
  #mic-btn.recording { background: #fff0f0; border-color: #e53935; color: #e53935; animation: pulse 1s infinite; }
  #mic-btn.speaking  { background: #f0f7ff; border-color: #1a73e8; color: #1a73e8; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="avatar">MA</div>
    <div class="info"><p>Menu Assistant</p><span>Restaurant AI Agent</span></div>
    <div class="online"></div>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="bubble">Hi! I'm your restaurant assistant 🍽️ What would you like to order today?</div>
      <span class="time">now</span>
    </div>
  </div>

  <div id="suggestions">
    <div class="sug" onclick="quickSend(this)">I want a burger</div>
    <div class="sug" onclick="quickSend(this)">Show me the menu</div>
    <div class="sug" onclick="quickSend(this)">What pizzas do you have?</div>
    <div class="sug" onclick="quickSend(this)">Any drinks?</div>
  </div>

  <div id="tts-toggle">
    <label><input type="checkbox" id="tts-on" checked> Read responses aloud</label>
  </div>

  <div id="partial-preview"></div>
  <div id="vad-bar-wrap"><div id="vad-bar-bg"><div id="vad-bar"></div></div></div>
  <div id="voice-status"></div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Type or press mic..."></textarea>
    <button id="mic-btn" onmousedown="startRec()" onmouseup="stopRec()"
            ontouchstart="startRec()" ontouchend="stopRec()" title="Hold to speak">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button id="send-btn" onclick="sendMsg()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
const sessionId    = 'ui-' + Math.random().toString(36).slice(2,8);
const messagesEl   = document.getElementById('messages');
const inputEl      = document.getElementById('msg-input');
const sendBtn      = document.getElementById('send-btn');
const micBtn       = document.getElementById('mic-btn');
const statusEl     = document.getElementById('voice-status');
const partialEl    = document.getElementById('partial-preview');
const ttsOn        = document.getElementById('tts-on');
const sugs         = document.getElementById('suggestions');
const vadBarWrap   = document.getElementById('vad-bar-wrap');
const vadBar       = document.getElementById('vad-bar');

// ── State ──────────────────────────────────────────────────
let mediaRecorder  = null;
let audioCtx       = null;
let analyser       = null;
let animFrame      = null;

let isRecording    = false;
let stream         = null;
let currentAudio   = null;
let audioChunks    = [];

// ── VAD visual ────────────────────────────────────────────
function startVAD(srcStream) {
  audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
  analyser  = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  audioCtx.createMediaStreamSource(srcStream).connect(analyser);
  const buf = new Uint8Array(analyser.fftSize);
  function tick() {
    if (!isRecording) return;
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i]-128)/128; sum += v*v; }
    const rms = Math.sqrt(sum / buf.length);
    const pct = Math.min(rms * 400, 100);
    vadBar.style.width = pct + '%';
    vadBar.className = rms > 0.01 ? 'loud' : '';
    animFrame = requestAnimationFrame(tick);
  }
  tick();
}

function stopVAD() {
  cancelAnimationFrame(animFrame);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  vadBar.style.width = '0%';
  vadBarWrap.classList.remove('active');
}

// ── STT via Groq Whisper ──────────────────────────────────
async function startRec() {
  if (isRecording) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  window.speechSynthesis.cancel();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = processAudio;

    mediaRecorder.start(100);
    isRecording = true;
    micBtn.classList.add('recording');
    vadBarWrap.classList.add('active');
    setStatus('Recording... (release to send)', 'recording');
    startVAD(stream);

  } catch(err) {
    setStatus('Mic error: ' + err.message, 'recording');
    setTimeout(() => setStatus(''), 2000);
  }
}

function stopRec() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  stopVAD();
  stream?.getTracks().forEach(t => t.stop());
  try { mediaRecorder?.stop(); } catch(e) {}
  setStatus('');
  partialEl.textContent = '';
}

async function processAudio() {
  setStatus('Processing...', 'processing');
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const formData = new FormData();
  formData.append('audio', blob, 'audio.webm');
  try {
    const res  = await fetch('/transcribe', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.text && data.text.trim()) {
      inputEl.value = data.text.trim();
      setStatus('');
      sendMsg();
    } else {
      setStatus('Could not understand, try again', 'recording');
      setTimeout(() => setStatus(''), 2000);
    }
  } catch(e) {
    setStatus('Transcription failed', 'recording');
    setTimeout(() => setStatus(''), 2000);
  }
}

// ── TTS via Browser Speech Synthesis ─────────────────────
function speak(text) {
  if (!ttsOn.checked) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/\*\*/g,'').replace(/\*/g,'').replace(/#+\s/g,'').replace(/\n/g,' ');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'en-US'; utter.rate = 1.0;
  utter.onstart = () => { micBtn.classList.add('speaking'); setStatus('Speaking...', 'speaking'); };
  utter.onend   = () => { micBtn.classList.remove('speaking'); setStatus(''); };
  window.speechSynthesis.speak(utter);
}

// ── Chat ──────────────────────────────────────────────────
function getTime() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${text.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div><span class="time">${getTime()}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const t = document.createElement('div');
  t.id='typing'; t.className='typing';
  t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  messagesEl.appendChild(t);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() { const t=document.getElementById('typing'); if(t) t.remove(); }
function setStatus(txt, cls='') { statusEl.textContent=txt; statusEl.className=cls; }

async function sendMsg() {
  const text = inputEl.value.trim();
  if (!text) return;
  sugs.style.display = 'none';
  inputEl.value = ''; inputEl.style.height = '38px';
  addMsg(text, 'user');
  sendBtn.disabled = true; micBtn.disabled = true;
  showTyping();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await res.json();
    hideTyping();
    const reply = data.response || data.detail || 'Error';
    addMsg(reply, 'bot');
    speak(reply);
  } catch(e) {
    hideTyping();
    addMsg('Could not reach the server.', 'bot');
  }
  sendBtn.disabled = false; micBtn.disabled = false;
  inputEl.focus();
}

function quickSend(el) { inputEl.value = el.textContent; sendMsg(); }

inputEl.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });
inputEl.addEventListener('input',   () => { inputEl.style.height='38px'; inputEl.style.height=Math.min(inputEl.scrollHeight,100)+'px'; });
</script>
</body>
</html>
