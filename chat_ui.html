<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد المطعم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #app { width: 420px; height: 650px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); display: flex; flex-direction: column; overflow: hidden; direction: rtl; }
  #header { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8f4fd; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1a73e8; flex-shrink: 0; }
  .info p { font-size: 14px; font-weight: 600; color: #111; }
  .info span { font-size: 12px; color: #888; }
  .online { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; margin-right: auto; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
  .msg.user { align-self: flex-start; align-items: flex-start; }
  .msg.bot  { align-self: flex-end;   align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 14px; border-bottom-left-radius: 4px; }
  .msg.bot  .bubble { background: #f1f3f4; color: #111; border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }
  .time { font-size: 11px; color: #aaa; padding: 0 4px; }
  .typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; background: #f1f3f4; border-radius: 14px; border-bottom-right-radius: 4px; align-self: flex-end; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #aaa; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }
  #suggestions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px; justify-content: flex-end; }
  .sug { font-size: 12px; padding: 5px 12px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; color: #555; background: #fff; }
  .sug:hover { background: #f5f5f5; }
  #tts-toggle { padding: 0 14px 6px; display: flex; justify-content: flex-end; }
  #tts-toggle label { font-size: 12px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  #voice-status { font-size: 12px; text-align: center; padding: 2px 14px 4px; min-height: 18px; color: #aaa; }
  #voice-status.recording  { color: #e53935; font-weight: 500; }
  #voice-status.processing { color: #f57c00; }
  #voice-status.speaking   { color: #1a73e8; }
  #input-area { padding: 10px 14px 12px; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: flex-end; }
  #msg-input { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; resize: none; height: 38px; max-height: 100px; outline: none; line-height: 1.4; color: #111; text-align: right; direction: rtl; }
  #msg-input:focus { border-color: #1a73e8; }
  #msg-input.interim      { border-color: #e53935; color: #555; font-style: italic; }
  #msg-input.final-ready  { border-color: #1D9E75; color: #111; font-style: normal; }
  #send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: #1a73e8; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  #send-btn:hover { background: #1558b0; }
  #send-btn:disabled, #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mic-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #555; }
  #mic-btn.recording { background: #fff0f0; border-color: #e53935; color: #e53935; animation: pulse 1s infinite; }
  #mic-btn.speaking  { background: #f0f7ff; border-color: #1a73e8; color: #1a73e8; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="avatar">م</div>
    <div class="info"><p>مساعد المطعم</p><span>Groq · Deepgram Nova-3</span></div>
    <div class="online"></div>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="bubble">أهلاً! أنا مساعد المطعم 🍽️ بماذا تريد أن تطلب اليوم؟</div>
      <span class="time">الآن</span>
    </div>
  </div>

  <div id="suggestions">
    <div class="sug" onclick="quickSend(this)">أريد برجر</div>
    <div class="sug" onclick="quickSend(this)">اعرض القائمة</div>
    <div class="sug" onclick="quickSend(this)">ما المتوفر من البيتزا؟</div>
    <div class="sug" onclick="quickSend(this)">المشروبات</div>
  </div>

  <div id="tts-toggle">
    <label><input type="checkbox" id="tts-on" checked> قراءة الردود بصوت</label>
  </div>

  <div id="voice-status"></div>

  <div id="input-area">
    <button id="send-btn" onclick="sendMsg()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
    <textarea id="msg-input" placeholder="اكتب أو اضغط على الميكروفون..."></textarea>
    <button id="mic-btn"
      onmousedown="startRec()" onmouseup="stopRec()"
      ontouchstart="startRec(event)" ontouchend="stopRec()"
      title="اضغط مع الاستمرار للتحدث">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
</div>

<script>
const sessionId  = 'ui-' + Math.random().toString(36).slice(2,8);
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('msg-input');
const sendBtn    = document.getElementById('send-btn');
const micBtn     = document.getElementById('mic-btn');
const statusEl   = document.getElementById('voice-status');
const ttsOn      = document.getElementById('tts-on');
const sugs       = document.getElementById('suggestions');

let mediaRecorder  = null;
let isRecording    = false;
let currentAudio   = null;
let micStream      = null;
let dgSocket       = null;
let finalTranscript = '';

// ── STT: Deepgram Nova-3 Streaming ───────────────────────
async function startRec(e) {
  if (e) e.preventDefault();
  if (isRecording) return;
  stopSpeaking();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    finalTranscript = '';
    inputEl.value = '';
    inputEl.classList.remove('final-ready');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    dgSocket = new WebSocket(`${proto}://${location.host}/ws/transcribe`);
    dgSocket.binaryType = 'arraybuffer';

    dgSocket.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.error) return;
      const t = (msg.transcript || '').trim();
      if (!t) return;
      if (msg.is_final) {
        finalTranscript += (finalTranscript ? ' ' : '') + t;
        inputEl.value = finalTranscript;
        inputEl.classList.add('final-ready');
      } else {
        inputEl.value = finalTranscript + (finalTranscript ? ' ' : '') + t;
        inputEl.classList.remove('final-ready');
        inputEl.classList.add('interim');
      }
      inputEl.style.height = '38px';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    };

    await new Promise((res, rej) => {
      dgSocket.onopen = res;
      dgSocket.onerror = rej;
    });

    mediaRecorder = new MediaRecorder(micStream, {
      mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'
    });
    mediaRecorder.ondataavailable = (ev) => {
      if (ev.data.size > 0 && dgSocket && dgSocket.readyState === WebSocket.OPEN)
        dgSocket.send(ev.data);
    };
    mediaRecorder.start(100);

    isRecording = true;
    micBtn.classList.add('recording');
    setStatus('🎤 جارٍ الاستماع... (أفلت للإرسال)', 'recording');
  } catch(e) {
    setStatus('تعذّر الوصول للميكروفون', 'recording');
    setTimeout(() => setStatus(''), 2000);
  }
}

function stopRec() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  inputEl.classList.remove('interim');

  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  micStream && micStream.getTracks().forEach(t => t.stop());

  const textNow = finalTranscript.trim();
  if (textNow) {
    if (dgSocket) { dgSocket.close(); dgSocket = null; }
    inputEl.value = textNow;
    setStatus('');
    sendMsg();
    return;
  }

  setStatus('جارٍ التعرف على الكلام...', 'processing');
  if (dgSocket) {
    dgSocket.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.error) return;
      const t = (msg.transcript || '').trim();
      if (t) {
        finalTranscript += (finalTranscript ? ' ' : '') + t;
        inputEl.value = finalTranscript.trim();
      }
    };
    dgSocket.onclose = () => {
      dgSocket = null;
      const text = finalTranscript.trim();
      if (text) { setStatus(''); sendMsg(); }
      else { setStatus('لم يتم التعرف على الكلام', 'recording'); setTimeout(() => setStatus(''), 2000); }
    };
    setTimeout(() => { if (dgSocket) { dgSocket.close(); dgSocket = null; } }, 800);
  } else {
    setStatus('لم يتم التعرف على الكلام', 'recording');
    setTimeout(() => setStatus(''), 2000);
  }
}

// ── TTS: Groq Orpheus Arabic ──────────────────────────────
async function speak(text) {
  if (!ttsOn.checked) return;
  stopSpeaking();
  const clean = text.replace(/[*#]/g,'').replace(/\n/g,' ');
  try {
    micBtn.classList.add('speaking');
    setStatus('جارٍ التحدث...', 'speaking');
    const res = await fetch('/speak', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: clean, session_id: sessionId })
    });
    if (!res.ok) throw new Error('speak ' + res.status);
    const buf     = await res.arrayBuffer();
    const ctx     = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ctx.decodeAudioData(buf);
    const src     = ctx.createBufferSource();
    src.buffer    = decoded;
    src.connect(ctx.destination);
    src.onended = () => { micBtn.classList.remove('speaking'); setStatus(''); ctx.close(); };
    src.start(0);
    currentAudio = { pause: () => { try { src.stop(); ctx.close(); } catch(e){} } };
  } catch(e) {
    console.error('TTS error:', e);
    micBtn.classList.remove('speaking');
    setStatus('');
  }
}

function stopSpeaking() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; micBtn.classList.remove('speaking'); setStatus(''); }
}

// ── Chat ──────────────────────────────────────────────────
function getTime() { return new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}); }

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${text.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div><span class="time">${getTime()}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const t = document.createElement('div');
  t.id='typing'; t.className='typing';
  t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  messagesEl.appendChild(t);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() { const t=document.getElementById('typing'); if(t) t.remove(); }
function setStatus(text, cls='') { statusEl.textContent=text; statusEl.className=cls; }

async function sendMsg() {
  const text = inputEl.value.trim();
  if (!text) return;
  sugs.style.display = 'none';
  inputEl.value = ''; inputEl.style.height = '38px'; inputEl.className = '';
  finalTranscript = '';
  addMsg(text, 'user');
  sendBtn.disabled = true; micBtn.disabled = true;
  showTyping();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await res.json();
    hideTyping();
    const reply = data.response || data.detail || 'خطأ';
    addMsg(reply, 'bot');
    speak(reply);
  } catch(e) {
    hideTyping();
    addMsg('تعذّر الوصول للسيرفر.', 'bot');
  }
  sendBtn.disabled = false; micBtn.disabled = false;
  inputEl.focus();
}

function quickSend(el) { inputEl.value = el.textContent; sendMsg(); }
inputEl.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });
inputEl.addEventListener('input', () => { inputEl.style.height='38px'; inputEl.style.height=Math.min(inputEl.scrollHeight,100)+'px'; });
</script>
</body>
</html>
